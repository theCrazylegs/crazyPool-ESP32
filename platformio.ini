; CrazyPool ESP32 — Configuration PlatformIO
; Ouvrir ce dossier dans VSCode, PlatformIO détecte automatiquement ce fichier.
;
; Commandes utiles (barre latérale PlatformIO ou terminal) :
;   pio run              → Compiler
;   pio run -t upload    → Compiler + flasher l'ESP32
;   pio device monitor   → Moniteur série (115200 baud)

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Le fichier .ino est à la racine du projet (pas dans src/)
src_dir = .

; Moniteur série
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; Librairies (PlatformIO les télécharge automatiquement)
lib_deps =
  DFRobot/DFRobot_ESP_PH @ ^1.0.0
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0
  arduino-libraries/LiquidCrystal @ ^1.0.7
  olehs/PZEM-004T-v30 @ ^3.0.0
  knolleary/PubSubClient @ ^2.8.0
  bblanchon/ArduinoJson @ ^7.0.0

; Note : EEPROM et WiFi sont inclus dans le framework ESP32, pas besoin de les déclarer.

; Options de build
build_flags =
  -DCORE_DEBUG_LEVEL=3   ; Logs ESP32 niveau INFO dans le moniteur série
  -DBOARD_HAS_PSRAM=0
