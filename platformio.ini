; CrazyPool ESP32 — Configuration PlatformIO
; Ouvrir ce dossier dans VSCode, PlatformIO détecte automatiquement ce fichier.
;
; Commandes utiles :
;   pio run              → Compiler
;   pio run -t upload    → Compiler + flasher l'ESP32
;   pio device monitor   → Moniteur série (115200 baud)

[platformio]
; Le fichier .ino est à la racine du projet (pas dans src/)
src_dir = .

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Moniteur série
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; Librairies
lib_deps =
  ; DFRobot ESP PH — fork Greenponik (installé localement ET sur GitHub)
  https://github.com/GreenPonik/DFRobot_ESP_PH_BY_GREENPONIK.git
  DallasTemperature
  OneWire
  PZEM-004T-v30
  PubSubClient
  arduino-libraries/LiquidCrystal @ ^1.0.7
  bblanchon/ArduinoJson @ ^7.0.0

; Note : EEPROM et WiFi sont inclus dans le framework ESP32 Arduino.

; Options de build
build_flags =
  -DCORE_DEBUG_LEVEL=3

[env:esp32dev_ota]
platform  = espressif32
board     = esp32dev
framework = arduino
upload_protocol   = espota
upload_port       = 192.168.1.128
upload_flags      = --auth=${sysenv.CRAZYPOOL_OTA_PASSWORD}   ; définir la var d'env CRAZYPOOL_OTA_PASSWORD sur votre système
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder, colorize
lib_deps          = ${env:esp32dev.lib_deps}
build_flags       = ${env:esp32dev.build_flags}
